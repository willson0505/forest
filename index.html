<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: [120.98, 23.8],
  zoom: 7.2,
  pitch: 0,
  bearing: 0
});


/* =========================================================
   GeoJSON 載入
   ========================================================= */

async function loadGeoJSON(filename) {

  const url = './' + encodeURIComponent(filename);

  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(
        filename + ' HTTP ' + response.status
      );
    }

    const data = await response.json();

    return data;

  } catch (error) {

    console.error(
      'GeoJSON 載入失敗：',
      filename,
      error
    );

    return null;
  }
}


/* =========================================================
   Map Load
   ========================================================= */

map.on('load', async () => {

  /* -------------------------------------------------------
     1. 先建立所有 GeoJSON
     不讓 DEM 問題阻止 GeoJSON
     ------------------------------------------------------- */

  const boundaryData =
    await loadGeoJSON('調查區界.geojson');

  const yaoData =
    await loadGeoJSON('南庄要存置林野.geojson');

  const zhunyaoData =
    await loadGeoJSON('南庄準要存置林野.geojson');

  const buyaoData =
    await loadGeoJSON('南庄不要存置林野.geojson');

  const changeData =
    await loadGeoJSON('南庄變動區.geojson');


  /* =====================================================
     2. 調查區界
     ===================================================== */

  if (boundaryData) {

    map.addSource('boundary-src', {
      type: 'geojson',
      data: boundaryData
    });

    map.addLayer({
      id: 'boundary-fill',
      type: 'fill',
      source: 'boundary-src',

      paint: {
        'fill-color': '#6b8e23',
        'fill-opacity': 0.08
      }
    });

    map.addLayer({
      id: 'boundary-line',
      type: 'line',
      source: 'boundary-src',

      paint: {
        'line-color': '#555555',
        'line-width': 1.2,
        'line-opacity': 0.8
      }
    });


    /*
     * 調查區名稱
     *
     * 你的調查區 GeoJSON 實際主要使用 layer 欄位，
     * 不是 name / 區名。
     */

    map.addLayer({
      id: 'boundary-label',
      type: 'symbol',
      source: 'boundary-src',

      layout: {

        'text-field': [
          'coalesce',
          ['get', 'layer'],
          ''
        ],

        'text-size': 12,

        'text-font': [
          'Open Sans Regular',
          'Arial Unicode MS Regular'
        ],

        'text-allow-overlap': false
      },

      paint: {

        'text-color': '#222222',

        'text-halo-color': '#ffffff',

        'text-halo-width': 2
      }
    });


    /*
     * 南庄發光外框
     * 先隱藏，Step 1 才開
     */

    map.addLayer({
      id: 'boundary-glow',
      type: 'line',
      source: 'boundary-src',

      paint: {

        'line-color': '#ffe600',

        'line-width': 0,

        'line-blur': 5,

        'line-opacity': 0.95
      }
    });
  }


  /* =====================================================
     3. 南庄要存置林野
     ===================================================== */

  if (yaoData) {

    map.addSource('yao-src', {
      type: 'geojson',
      data: yaoData
    });

    map.addLayer({

      id: 'yao-layer',

      type: 'fill',

      source: 'yao-src',

      layout: {
        visibility: 'none'
      },

      paint: {

        'fill-color': '#2e7d32',

        'fill-opacity': 0.8,

        'fill-outline-color': '#114b14'
      }
    });
  }


  /* =====================================================
     4. 南庄準要存置林野
     ===================================================== */

  if (zhunyaoData) {

    map.addSource('zhunyao-src', {
      type: 'geojson',
      data: zhunyaoData
    });

    map.addLayer({

      id: 'zhunyao-layer',

      type: 'fill',

      source: 'zhunyao-src',

      layout: {
        visibility: 'none'
      },

      paint: {

        'fill-color': '#ef6c00',

        'fill-opacity': 0.8,

        'fill-outline-color': '#8c3b00'
      }
    });


    /* 番號 */

    map.addLayer({

      id: 'zhunyao-label',

      type: 'symbol',

      source: 'zhunyao-src',

      layout: {

        visibility: 'none',

        'text-field': [
          'to-string',
          ['get', '番號']
        ],

        'text-size': 13,

        'text-font': [
          'Open Sans Bold',
          'Arial Unicode MS Bold'
        ],

        'text-allow-overlap': true,

        'text-ignore-placement': true
      },

      paint: {

        'text-color': '#ffffff',

        'text-halo-color': '#000000',

        'text-halo-width': 2
      }
    });
  }


  /* =====================================================
     5. 南庄不要存置林野
     ===================================================== */

  if (buyaoData) {

    map.addSource('buyao-src', {
      type: 'geojson',
      data: buyaoData
    });

    map.addLayer({

      id: 'buyao-layer',

      type: 'fill',

      source: 'buyao-src',

      layout: {
        visibility: 'none'
      },

      paint: {

        'fill-color': '#d32f2f',

        'fill-opacity': 0.8,

        'fill-outline-color': '#7f0000'
      }
    });
  }


  /* =====================================================
     6. 南庄變動區
     ===================================================== */

  if (changeData) {

    map.addSource('change-src', {
      type: 'geojson',
      data: changeData
    });

    map.addLayer({

      id: 'change-layer',

      type: 'fill',

      source: 'change-src',

      layout: {
        visibility: 'none'
      },

      filter: [
        'any',

        ['==', ['to-string', ['get', '番號']], '46ノ三'],

        ['==', ['to-string', ['get', '番號']], '46之三']
      ],

      paint: {

        'fill-color': '#ef6c00',

        'fill-opacity': 0.8,

        'fill-outline-color': '#8c3b00'
      }
    });


    map.addLayer({

      id: 'change-label',

      type: 'symbol',

      source: 'change-src',

      layout: {

        visibility: 'none',

        'text-field': [
          'to-string',
          ['get', '番號']
        ],

        'text-size': 14,

        'text-font': [
          'Open Sans Bold',
          'Arial Unicode MS Bold'
        ],

        'text-allow-overlap': true,

        'text-ignore-placement': true
      },

      filter: [
        'any',

        ['==', ['to-string', ['get', '番號']], '46ノ三'],

        ['==', ['to-string', ['get', '番號']], '46之三']
      ],

      paint: {

        'text-color': '#ffffff',

        'text-halo-color': '#000000',

        'text-halo-width': 2
      }
    });
  }


  /* =====================================================
     7. 最後才加入 3D Terrain
     
     就算這裡失敗，也不會影響上面的 GeoJSON
     ===================================================== */

  try {

    map.addSource('taiwan-dem', {

      type: 'raster-dem',

      url:
        'https://demotiles.maplibre.org/terrain-tiles/tiles.json',

      tileSize: 256,

      maxzoom: 12
    });

    map.setTerrain({

      source: 'taiwan-dem',

      exaggeration: 1.5
    });

    map.addLayer({

      id: 'terrain-hillshade',

      type: 'hillshade',

      source: 'taiwan-dem',

      paint: {

        'hillshade-exaggeration': 0.5
      }
    });

  } catch (error) {

    console.warn(
      '3D Terrain 載入失敗，但 GeoJSON 不受影響。',
      error
    );

  }


  /* =====================================================
     8. Terrain 放到所有 GeoJSON 底下
     ===================================================== */

  if (map.getLayer('terrain-hillshade')) {

    map.moveLayer(
      'terrain-hillshade',
      'boundary-fill'
    );
  }

});


/* =========================================================
   圖層顯示控制
   ========================================================= */

function setLayerVisibility(layerId, visible) {

  if (map.getLayer(layerId)) {

    map.setLayoutProperty(

      layerId,

      'visibility',

      visible
        ? 'visible'
        : 'none'
    );
  }
}


/* =========================================================
   Scrollama
   ========================================================= */

const stepActions = {


  /* -------------------------------------------------------
     [1]
     南庄調查區
     ------------------------------------------------------- */

  1: () => {

    setLayerVisibility(
      'yao-layer',
      false
    );

    setLayerVisibility(
      'zhunyao-layer',
      false
    );

    setLayerVisibility(
      'buyao-layer',
      false
    );

    setLayerVisibility(
      'zhunyao-label',
      false
    );

    setLayerVisibility(
      'change-layer',
      false
    );

    setLayerVisibility(
      'change-label',
      false
    );


    if (map.getLayer('boundary-glow')) {

      map.setPaintProperty(
        'boundary-glow',
        'line-width',
        8
      );
    }


    map.flyTo({

      center: [
        121.03,
        24.58
      ],

      zoom: 11.2,

      pitch: 0,

      bearing: 0,

      duration: 2000
    });
  },


  /* -------------------------------------------------------
     [2]
     三種林野
     ------------------------------------------------------- */

  2: () => {

    if (map.getLayer('boundary-glow')) {

      map.setPaintProperty(
        'boundary-glow',
        'line-width',
        0
      );
    }


    setLayerVisibility(
      'yao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-layer',
      true
    );

    setLayerVisibility(
      'buyao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-label',
      false
    );

    setLayerVisibility(
      'change-layer',
      false
    );

    setLayerVisibility(
      'change-label',
      false
    );


    map.flyTo({

      center: [
        121.02,
        24.56
      ],

      zoom: 11.5,

      pitch: 0,

      bearing: 0,

      duration: 1800
    });
  },


  /* -------------------------------------------------------
     [3]
     3D + 番號
     ------------------------------------------------------- */

  3: () => {

    setLayerVisibility(
      'yao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-layer',
      true
    );

    setLayerVisibility(
      'buyao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-label',
      true
    );

    setLayerVisibility(
      'change-layer',
      false
    );

    setLayerVisibility(
      'change-label',
      false
    );


    map.flyTo({

      center: [
        121.012,
        24.615
      ],

      zoom: 13.8,

      pitch: 60,

      bearing: -20,

      duration: 2200
    });
  },


  /* -------------------------------------------------------
     [4]
     46ノ三 / 46之三
     ------------------------------------------------------- */

  4: () => {

    setLayerVisibility(
      'yao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-layer',
      true
    );

    setLayerVisibility(
      'buyao-layer',
      true
    );

    setLayerVisibility(
      'zhunyao-label',
      true
    );

    setLayerVisibility(
      'change-layer',
      true
    );

    setLayerVisibility(
      'change-label',
      true
    );


    map.flyTo({

      center: [
        120.985,
        24.522
      ],

      zoom: 14.2,

      pitch: 45,

      bearing: 10,

      duration: 2000
    });
  }
};


/* =========================================================
   Scrollama
   ========================================================= */

const scroller = scrollama();

scroller

  .setup({

    step: '.step-section',

    offset: 0.5
  })

  .onStepEnter((response) => {

    document
      .querySelectorAll('.step-section')
      .forEach(el => {

        el.classList.remove(
          'is-active'
        );

      });


    response.element.classList.add(
      'is-active'
    );


    const stepIdx =
      response.element
        .getAttribute('data-step');


    if (stepActions[stepIdx]) {

      stepActions[stepIdx]();

    }

  });


window.addEventListener(
  'resize',
  scroller.resize
);
</script>
