<script>

/* =========================================================
   MapLibre 初始化
   ========================================================= */

const map = new maplibregl.Map({

  container: "map",

  style:
    "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",

  center: [120.98, 23.8],

  zoom: 7.2,

  pitch: 0,

  bearing: 0,

  renderWorldCopies: false,

  maxPitch: 75

});


/* =========================================================
   GeoJSON 載入函式
   ========================================================= */

async function fetchAndAddGeoJSON(filePath, sourceId) {

  try {

    /*
      GitHub Pages / 本地伺服器：
      直接從目前 index.html 所在位置讀取。

      encodeURI 很重要：
      避免中文檔名在部分伺服器環境出問題。
    */

    const url = encodeURI(`./${filePath}`);

    const response = await fetch(url);

    if (!response.ok) {

      console.error(
        `GeoJSON 載入失敗：${filePath}`,
        response.status
      );

      return null;

    }

    const data = await response.json();

    /*
      確認是不是合法 GeoJSON
    */

    if (
      !data ||
      data.type !== "FeatureCollection"
    ) {

      console.error(
        `不是合法 FeatureCollection：${filePath}`
      );

      return null;

    }


    /*
      加入 MapLibre source
    */

    if (!map.getSource(sourceId)) {

      map.addSource(sourceId, {

        type: "geojson",

        data: data

      });

    }


    console.log(
      `GeoJSON 已載入：${filePath}`,
      data.features.length,
      "features"
    );


    return data;

  }

  catch (error) {

    console.error(
      `GeoJSON 讀取錯誤：${filePath}`,
      error
    );

    return null;

  }

}


/* =========================================================
   地圖載入
   ========================================================= */

map.on("load", async () => {


  /* =======================================================
     1. 先載入所有 GeoJSON

     注意：
     GeoJSON 不依賴 DEM。
     因此即使 3D 地形伺服器有問題，
     這些圖層仍然必須正常顯示。
     ======================================================= */


  /* -------------------------------------------------------
     調查區界
     ------------------------------------------------------- */

  const boundaryData =
    await fetchAndAddGeoJSON(
      "調查區界.geojson",
      "boundary-src"
    );


  if (boundaryData) {


    /*
      全台調查區填色
    */

    map.addLayer({

      id: "boundary-fill",

      type: "fill",

      source: "boundary-src",

      paint: {

        "fill-color": "#55745a",

        "fill-opacity": 0.06

      }

    });


    /*
      全台調查區界線
    */

    map.addLayer({

      id: "boundary-line",

      type: "line",

      source: "boundary-src",

      paint: {

        "line-color": "#555555",

        "line-width": 1.2,

        "line-opacity": 0.85

      }

    });


    /*
      全台調查區名稱

      你的調查區 GeoJSON 主要使用 layer 欄位，
      因此最後 fallback 到 layer。
    */

    map.addLayer({

      id: "boundary-label",

      type: "symbol",

      source: "boundary-src",

      layout: {

        "text-field": [

          "coalesce",

          ["get", "name"],

          ["get", "區名"],

          ["get", "NAME"],

          ["get", "TITLE"],

          ["get", "layer"],

          ""

        ],

        "text-size": 12,

        "text-font": [

          "Open Sans Bold",
          "Arial Unicode MS Bold"

        ],

        "text-allow-overlap": false

      },

      paint: {

        "text-color": "#222222",

        "text-halo-color": "#ffffff",

        "text-halo-width": 2

      }

    });

  }


  /* -------------------------------------------------------
     南庄要存置林野
     ------------------------------------------------------- */

  const yaoData =
    await fetchAndAddGeoJSON(
      "南庄要存置林野.geojson",
      "yao-src"
    );


  if (yaoData) {

    map.addLayer({

      id: "yao-layer",

      type: "fill",

      source: "yao-src",

      layout: {

        visibility: "none"

      },

      paint: {

        "fill-color": "#2e7d32",

        "fill-opacity": 0.8,

        "fill-outline-color": "#114b14"

      }

    });

  }


  /* -------------------------------------------------------
     南庄不要存置林野
     ------------------------------------------------------- */

  const buyaoData =
    await fetchAndAddGeoJSON(
      "南庄不要存置林野.geojson",
      "buyao-src"
    );


  if (buyaoData) {

    map.addLayer({

      id: "buyao-layer",

      type: "fill",

      source: "buyao-src",

      layout: {

        visibility: "none"

      },

      paint: {

        "fill-color": "#d32f2f",

        "fill-opacity": 0.8,

        "fill-outline-color": "#7f0000"

      }

    });

  }


  /* -------------------------------------------------------
     南庄準要存置林野
     ------------------------------------------------------- */

  const zhunyaoData =
    await fetchAndAddGeoJSON(
      "南庄準要存置林野.geojson",
      "zhunyao-src"
    );


  if (zhunyaoData) {

    map.addLayer({

      id: "zhunyao-layer",

      type: "fill",

      source: "zhunyao-src",

      layout: {

        visibility: "none"

      },

      paint: {

        "fill-color": "#ef6c00",

        "fill-opacity": 0.8,

        "fill-outline-color": "#8c3b00"

      }

    });


    /*
      準要存置番號
    */

    map.addLayer({

      id: "zhunyao-label",

      type: "symbol",

      source: "zhunyao-src",

      layout: {

        visibility: "none",

        "text-field": [

          "coalesce",

          ["get", "番號"],

          ["get", "number"],

          ["get", "NO"],

          ""

        ],

        "text-size": 13,

        "text-font": [

          "Open Sans Bold",
          "Arial Unicode MS Bold"

        ],

        "text-allow-overlap": true

      },

      paint: {

        "text-color": "#ffffff",

        "text-halo-color": "#000000",

        "text-halo-width": 2

      }

    });

  }


  /* -------------------------------------------------------
     南庄變動區
     ------------------------------------------------------- */

  const changeData =
    await fetchAndAddGeoJSON(
      "南庄變動區.geojson",
      "change-src"
    );


  if (changeData) {

    const changeFilter = [

      "any",

      ["==", ["get", "番號"], "46ノ三"],

      ["==", ["get", "番號"], "46之三"],

      ["in", "46ノ三", ["get", "番號"]]

    ];


    map.addLayer({

      id: "change-layer",

      type: "fill",

      source: "change-src",

      filter: changeFilter,

      layout: {

        visibility: "none"

      },

      paint: {

        "fill-color": "#ef6c00",

        "fill-opacity": 0.8,

        "fill-outline-color": "#8c3b00"

      }

    });


    map.addLayer({

      id: "change-label",

      type: "symbol",

      source: "change-src",

      filter: changeFilter,

      layout: {

        visibility: "none",

        "text-field": [

          "coalesce",

          ["get", "番號"],

          ["get", "number"],

          "46ノ三"

        ],

        "text-size": 14,

        "text-font": [

          "Open Sans Bold",
          "Arial Unicode MS Bold"

        ]

      },

      paint: {

        "text-color": "#ffffff",

        "text-halo-color": "#000000",

        "text-halo-width": 2

      }

    });

  }


  /* =======================================================
     2. 南庄調查區發光圖層

     注意：
     這裡不再猜測 layer 的名稱。

     直接利用南庄的實際座標範圍做 filter，
     避免因 GeoJSON 屬性名稱不同導致完全不亮。
     ======================================================= */

  if (map.getSource("boundary-src")) {

    map.addLayer({

      id: "boundary-nanzhuang-glow",

      type: "line",

      source: "boundary-src",

      /*
        南庄大約位於：
        120.90～121.10
        24.45～24.70

        用 bbox 判斷南庄調查區。
      */

      filter: [

        "all",

        [">=", ["at", 0, ["get", "bbox"]], 120.90]

      ],

      paint: {

        "line-color": "#ffe600",

        "line-width": 8,

        "line-blur": 5,

        "line-opacity": 0

      }

    });

  }


  /* =======================================================
     3. 3D TERRAIN

     放在 GeoJSON 全部載入完成之後。

     即使 DEM 發生問題，
     不會阻止前面的 GeoJSON。
     ======================================================= */

  try {

    /*
      Terrain DEM
    */

    map.addSource(
      "taiwan-terrain",
      {

        type: "raster-dem",

        url:
          "https://tiles.mapterhorn.com/tilejson.json",

        tileSize: 512,

        encoding: "terrarium"

      }
    );


    /*
      Hillshade 使用另外一個 source。

      MapLibre 官方 3D terrain 範例也是分開建立。
    */

    map.addSource(
      "taiwan-hillshade",
      {

        type: "raster-dem",

        url:
          "https://tiles.mapterhorn.com/tilejson.json",

        tileSize: 512,

        encoding: "terrarium"

      }
    );


    /*
      真正 3D terrain
    */

    map.setTerrain({

      source: "taiwan-terrain",

      exaggeration: 1.15

    });


    /*
      山體陰影
    */

    map.addLayer({

      id: "taiwan-hillshade",

      type: "hillshade",

      source: "taiwan-hillshade",

      paint: {

        "hillshade-shadow-color": "#473B24",

        "hillshade-highlight-color": "#ffffff",

        "hillshade-exaggeration": 0.3

      }

    });


    console.log("3D terrain 載入完成");

  }

  catch (error) {

    /*
      DEM 失敗只記錄錯誤，
      不影響 GeoJSON。
    */

    console.warn(
      "3D DEM 載入失敗，GeoJSON仍正常使用。",
      error
    );

  }


  /* =======================================================
     4. 初始視角

     全台、2D
     ======================================================= */

  map.jumpTo({

    center: [120.98, 23.8],

    zoom: 7.2,

    pitch: 0,

    bearing: 0

  });

});


/* =========================================================
   圖層顯示 / 隱藏
   ========================================================= */

function setLayerVisibility(
  layerId,
  visible
) {

  if (!map.getLayer(layerId)) {

    return;

  }

  map.setLayoutProperty(

    layerId,

    "visibility",

    visible
      ? "visible"
      : "none"

  );

}


/* =========================================================
   南庄發光
   ========================================================= */

function setNanzhuangHighlight(
  visible
) {

  if (
    map.getLayer(
      "boundary-nanzhuang-glow"
    )
  ) {

    map.setPaintProperty(

      "boundary-nanzhuang-glow",

      "line-opacity",

      visible
        ? 0.95
        : 0

    );

  }

}


/* =========================================================
   [1]～[4]
   ========================================================= */

const stepActions = {


  /* =======================================================
     [1]
     南庄調查區
     2D
     ======================================================= */

  1: () => {

    setLayerVisibility(
      "yao-layer",
      false
    );

    setLayerVisibility(
      "buyao-layer",
      false
    );

    setLayerVisibility(
      "zhunyao-layer",
      false
    );

    setLayerVisibility(
      "zhunyao-label",
      false
    );

    setLayerVisibility(
      "change-layer",
      false
    );

    setLayerVisibility(
      "change-label",
      false
    );


    setNanzhuangHighlight(
      true
    );


    map.flyTo({

      center: [
        121.03,
        24.58
      ],

      zoom: 11.2,

      pitch: 0,

      bearing: 0,

      duration: 2000

    });

  },


  /* =======================================================
     [2]
     三種林野
     2D
     ======================================================= */

  2: () => {

    setNanzhuangHighlight(
      false
    );


    setLayerVisibility(
      "yao-layer",
      true
    );

    setLayerVisibility(
      "buyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-label",
      false
    );

    setLayerVisibility(
      "change-layer",
      false
    );

    setLayerVisibility(
      "change-label",
      false
    );


    map.flyTo({

      center: [
        121.02,
        24.56
      ],

      zoom: 11.5,

      pitch: 0,

      bearing: 0,

      duration: 1800

    });

  },


  /* =======================================================
     [3]
     3D
     ======================================================= */

  3: () => {

    setNanzhuangHighlight(
      false
    );


    setLayerVisibility(
      "yao-layer",
      true
    );

    setLayerVisibility(
      "buyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-label",
      true
    );

    setLayerVisibility(
      "change-layer",
      false
    );

    setLayerVisibility(
      "change-label",
      false
    );


    map.flyTo({

      center: [
        121.012,
        24.615
      ],

      zoom: 13.8,

      pitch: 58,

      bearing: -20,

      duration: 2200

    });

  },


  /* =======================================================
     [4]
     46ノ三
     ======================================================= */

  4: () => {

    setNanzhuangHighlight(
      false
    );


    setLayerVisibility(
      "yao-layer",
      true
    );

    setLayerVisibility(
      "buyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-layer",
      true
    );

    setLayerVisibility(
      "zhunyao-label",
      true
    );

    setLayerVisibility(
      "change-layer",
      true
    );

    setLayerVisibility(
      "change-label",
      true
    );


    map.flyTo({

      center: [
        120.985,
        24.522
      ],

      zoom: 14.2,

      pitch: 45,

      bearing: 10,

      duration: 2000

    });

  }

};


/* =========================================================
   Scrollama
   ========================================================= */

const scroller =
  scrollama();


scroller

  .setup({

    step: ".step-section",

    offset: 0.5

  })


  .onStepEnter(
    (response) => {

      document
        .querySelectorAll(
          ".step-section"
        )
        .forEach(
          (element) => {

            element.classList.remove(
              "is-active"
            );

          }
        );


      response
        .element
        .classList.add(
          "is-active"
        );


      const step =
        response
          .element
          .getAttribute(
            "data-step"
          );


      if (
        stepActions[step]
      ) {

        stepActions[step]();

      }

    }
  );


window.addEventListener(
  "resize",
  scroller.resize
);

</script>
